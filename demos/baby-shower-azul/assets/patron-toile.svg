<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
<!-- PATRON DE FONDO (provisional).
     Motivo tipo toile: jirafas, elefantes, globos y arboles en azul monocromo.
     Para sustituirlo, deja tu archivo aqui con este mismo nombre.
     OJO: en un SVG no se puede escribir un doble guion dentro de un comentario. -->
<defs>
  <g id="arbol" fill="none" stroke="#8fa9c6" stroke-width="1.1" stroke-linecap="round">
    <path d="M14 44V22"/>
    <path d="M14 30l-7-6M14 34l7-6M14 25l-5-5M14 27l6-6"/>
    <path d="M14 22c-8 0-14-5-14-11S6 0 14 0s14 5 14 11-6 11-14 11z" opacity=".85"/>
    <path d="M4 8c3-2 7-3 10-2M18 4c4 1 6 3 7 6" opacity=".6"/>
  </g>

  <g id="globo" fill="none" stroke="#8fa9c6" stroke-width="1.1" stroke-linecap="round">
    <path d="M13 0C6 0 0 6 0 14c0 7 5 13 9 18l4 5 4-5c4-5 9-11 9-18C26 6 20 0 13 0z"/>
    <path d="M13 0v37M4 5c2 10 4 20 5 27M22 5c-2 10-4 20-5 27" opacity=".55"/>
    <path d="M9 37h8l-1 6h-6z"/>
    <path d="M10 43l2 4M16 43l-2 4" opacity=".7"/>
  </g>

  <g id="jirafa" fill="none" stroke="#8fa9c6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 60V38c0-6 1-11 4-15 4-6 5-11 4-16"/>
    <path d="M24 7c-2-2-3-5-2-7 1-3 5-3 7-1 2 2 2 5 0 7"/>
    <path d="M27 1c0-2 0-3 1-4M31 2c1-2 3-3 4-3" transform="translate(0,1)"/>
    <path d="M16 38c-4 3-6 9-5 15 1 5 5 8 11 8 8 1 15 0 19-4 3-3 4-8 2-13-1-4-4-7-8-8-6-2-14-1-19 2z"/>
    <path d="M13 53v9M22 55v7M33 52v10M41 49v13"/>
    <ellipse cx="21" cy="45" rx="2.6" ry="2" opacity=".5"/>
    <ellipse cx="31" cy="49" rx="3" ry="2.2" opacity=".5"/>
    <ellipse cx="27" cy="41" rx="2.4" ry="1.8" opacity=".5"/>
    <ellipse cx="37" cy="45" rx="2.6" ry="2" opacity=".5"/>
  </g>

  <g id="elefante" fill="none" stroke="#8fa9c6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 44c0-6-1-11 1-16 2-7 8-11 15-13 8-1 16 1 20 6 4 4 5 10 4 15-1 3-2 6-4 8"/>
    <path d="M9 44v-8M20 45v-9M36 45v-8M45 44v-8"/>
    <path d="M9 30c-3 1-6 4-6 8s1 8 3 10c2 2 4 1 5-1 1-2 0-5-1-8"/>
    <path d="M16 22c-2-2-3-6-2-9 2-4 7-5 11-4"/>
    <circle cx="21" cy="20" r="1.4" fill="#8fa9c6" stroke="none"/>
    <path d="M33 12c5 0 9 3 11 7" opacity=".6"/>
    <path d="M13 29c-1 3-1 6 0 9" opacity=".6"/>
  </g>

  <g id="estrella" fill="#a8bed6" stroke="none">
    <path d="M5 0l1.5 3.5L10 5 6.5 6.5 5 10 3.5 6.5 0 5l3.5-1.5z"/>
  </g>
</defs>

<rect width="300" height="300" fill="none"/>

<g opacity=".55">
  <!-- fila superior -->
  <use href="#jirafa"   x="18"  y="14"/>
  <use href="#globo"    x="122" y="8"/>
  <use href="#arbol"    x="196" y="26"/>
  <use href="#elefante" x="238" y="30"/>

  <!-- fila media -->
  <use href="#arbol"    x="70"  y="110"/>
  <use href="#elefante" x="112" y="112"/>
  <use href="#globo"    x="222" y="108"/>
  <use href="#jirafa"   x="256" y="120"/>

  <!-- fila inferior -->
  <use href="#elefante" x="16"  y="216"/>
  <use href="#jirafa"   x="94"  y="204"/>
  <use href="#arbol"    x="158" y="232"/>
  <use href="#globo"    x="196" y="212"/>
  <use href="#arbol"    x="266" y="226"/>

  <!-- motivos que cruzan el borde: se repiten en el lado opuesto -->
  <use href="#arbol"    x="-14" y="62"/>
  <use href="#arbol"    x="286" y="62"/>
  <use href="#globo"    x="58"  y="-16"/>
  <use href="#globo"    x="58"  y="284"/>
</g>

<g opacity=".45">
  <use href="#estrella" x="60"  y="70"/>
  <use href="#estrella" x="186" y="86"/>
  <use href="#estrella" x="30"  y="160"/>
  <use href="#estrella" x="214" y="170"/>
  <use href="#estrella" x="140" y="60"/>
  <use href="#estrella" x="96"  y="266"/>
  <use href="#estrella" x="252" y="252"/>
  <use href="#estrella" x="170" y="140"/>
</g>
</svg>
